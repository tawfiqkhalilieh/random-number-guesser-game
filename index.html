<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خمن الرقم 🎯</title>

<style>
body {
    font-family: "Comic Sans MS", cursive;
    background-color: #87CEFA;
    text-align: center;
    margin: 0;
    padding: 20px;
    color: #333;
    direction: rtl;
}

.container {
    background-color: #fff8dc;
    padding: 20px;
    border-radius: 20px;
    border: 5px solid #ff6b6b;
    max-width: 400px;
    margin: auto;
}

h1 {
    font-size: 32px;
    color: #ff6b6b;
}

p {
    font-size: 18px;
}

input {
    padding: 12px;
    font-size: 18px;
    border-radius: 12px;
    border: 3px solid #48dbfb;
    margin-top: 15px;
    width: 120px;
    text-align: center;
    display: block;
    margin-left: auto;
    margin-right: auto;
}

button {
    margin-top: 15px;
    padding: 15px;
    font-size: 18px;
    border: none;
    border-radius: 15px;
    background-color: #1dd1a1;
    color: white;
    cursor: pointer;
    width: 70%;
}

button:active {
    background-color: #10ac84;
}

#message {
    margin-top: 20px;
    font-size: 22px;
    font-weight: bold;
}

#lastGuess, #attempts {
    margin-top: 10px;
    font-size: 16px;
}

.win {
    color: #ff9f43;
    animation: jump 0.4s infinite alternate;
}

@keyframes jump {
    from { transform: translateY(0); }
    to { transform: translateY(-8px); }
}

/* Mobile adjustments */
@media (max-width: 400px) {
    input {
        width: 100px;
        font-size: 16px;
    }

    button {
        width: 100%;
    }

    h1 {
        font-size: 26px;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>🎯 خمن الرقم!</h1>
    <p>اختر رقم بين 1 و 100</p>

    <input type="number" id="guess" min="1" max="100" inputmode="numeric">
    
    <button onclick="checkGuess()">خمن</button>

    <div id="lastGuess">آخر محاولة: <span id="last">لا يوجد</span></div>
    <div id="attempts">عدد المحاولات: <span id="count">0</span></div>
    <div id="message"></div>
</div>

<script>
let x = Math.floor(Math.random() * 100) + 1;
let attempts = 0;

const input = document.getElementById("guess");

// Enter key support
input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        checkGuess();
    }
});

function checkGuess() {
    let z = Number(input.value);
    let message = document.getElementById("message");
    let last = document.getElementById("last");
    let count = document.getElementById("count");

    if (!z) {
        message.textContent = "⚠️ أدخل رقم!";
        return;
    }

    attempts++;
    count.textContent = attempts;

    last.textContent = z;

    if (z === x) {
        message.textContent = "🎉 فزت!!!";
        message.className = "win";

        // reset game after short delay
        setTimeout(() => {
            x = Math.floor(Math.random() * 100) + 1;
            attempts = 0;
            count.textContent = 0;
            last.textContent = "لا يوجد";
            message.textContent = "";
        }, 2000);
    } 
    else if (z > x) {
        message.textContent = "⬇️ أقل!";
        message.className = "";
    } 
    else {
        message.textContent = "⬆️ أكثر!";
        message.className = "";
    }

    input.value = "";
}
</script>

</body>
</html>
