<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess the Number 🎯</title>

<style>
body {
    font-family: "Comic Sans MS", cursive;
    background-color: #87CEFA;
    text-align: center;
    margin: 0;
    padding: 20px;
    color: #333;
}

.container {
    background-color: #fff8dc;
    padding: 20px;
    border-radius: 20px;
    border: 5px solid #ff6b6b;
    max-width: 400px;
    margin: auto;
}

h1 {
    font-size: 32px;
    color: #ff6b6b;
}

p {
    font-size: 18px;
}

input {
    padding: 15px;
    font-size: 18px;
    border-radius: 12px;
    border: 3px solid #48dbfb;
    margin-top: 15px;
    width: 80%;
    text-align: center;
}

button {
    margin-top: 15px;
    padding: 15px;
    font-size: 18px;
    border: none;
    border-radius: 15px;
    background-color: #1dd1a1;
    color: white;
    cursor: pointer;
    width: 80%;
}

button:active {
    background-color: #10ac84;
}

#message {
    margin-top: 20px;
    font-size: 22px;
    font-weight: bold;
}

#lastGuess {
    margin-top: 10px;
    font-size: 16px;
}

.win {
    color: #ff9f43;
    animation: jump 0.4s infinite alternate;
}

@keyframes jump {
    from { transform: translateY(0); }
    to { transform: translateY(-8px); }
}

/* Make things even nicer on very small screens */
@media (max-width: 400px) {
    h1 {
        font-size: 26px;
    }

    input, button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>🎯 Guess the Number!</h1>
    <p>Pick a number between 1 and 100</p>

    <input type="number" id="guess" min="1" max="100" inputmode="numeric">
    <br>
    <button onclick="checkGuess()">Guess!</button>

    <div id="lastGuess">Last guess: <span id="last">None</span></div>
    <div id="message"></div>
</div>

<script>
let x = Math.floor(Math.random() * 100) + 1;

const input = document.getElementById("guess");

// Enter key (also works on mobile keyboards)
input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        checkGuess();
    }
});

function checkGuess() {
    let z = Number(input.value);
    let message = document.getElementById("message");
    let last = document.getElementById("last");

    if (!z) {
        message.textContent = "⚠️ Enter a number!";
        return;
    }

    last.textContent = z;

    if (z === x) {
        message.textContent = "🎉 You won!!!";
        message.className = "win";
    } 
    else if (z > x) {
        message.textContent = "⬇️ Lower!";
        message.className = "";
    } 
    else {
        message.textContent = "⬆️ Higher!";
        message.className = "";
    }

    input.value = "";
}
</script>

</body>
</html>
